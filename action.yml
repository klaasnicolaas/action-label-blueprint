name: "Label Blueprint"
author: "Klaas Schoute <hello@student-techlife.com>"
description: "Synchronize GitHub labels from a declarative YAML or JSON configuration"

branding:
  icon: "tag"
  color: "blue"

inputs:
  github-token:
    description: "Token with Issues write permission for every target repository."
    required: false
    default: ${{ github.token }}
  labels-file:
    description: "Local path or HTTP(S) URL to a YAML or JSON label configuration."
    required: false
    default: ".github/labels.yml"
  repositories:
    description: "Comma- or newline-separated owner/repository targets. Defaults to the current repository."
    required: false
    default: ""
  prune:
    description: "Prune labels that are not present in the configuration using prune-strategy."
    required: false
    default: "false"
  prune-strategy:
    description: "Pruning strategy: delete permanently removes labels; archive preserves historical assignments."
    required: false
    default: "delete"
  prune-ignore:
    description: "Comma- or newline-separated label names or glob patterns excluded from pruning."
    required: false
    default: ""
  mode:
    description: "Operating mode: sync applies changes, preview reports them, and check reports them and fails on drift."
    required: false
    default: "sync"
  dry-run:
    description: "Deprecated alias for mode: preview. Retained for backwards compatibility."
    required: false
    default: "false"

outputs:
  repositories:
    description: "Number of successfully synchronized repositories."
  created:
    description: "Number of labels created across all repositories."
  updated:
    description: "Number of active labels updated or renamed across all repositories, excluding unarchived labels."
  deleted:
    description: "Number of labels deleted across all repositories."
  archived:
    description: "Number of labels archived across all repositories."
  unarchived:
    description: "Number of labels unarchived across all repositories, including any metadata changes."
  unchanged:
    description: "Number of labels that already matched the configuration."
  summary:
    description: "JSON array with synchronization counts for each repository."

runs:
  using: "node24"
  main: "dist/index.cjs"
